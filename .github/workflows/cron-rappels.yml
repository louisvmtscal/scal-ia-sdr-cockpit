name: Rappels RDV (jour J + WhatsApp + veille)

# Declenche les routes cron qui ont besoin d'une frequence < 1x/jour
# (impossible nativement sur le plan Vercel Hobby, voir vercel.json pour
# les crons natifs quotidiens). GitHub Actions tourne gratuitement toutes
# les 15 min tant que le repo reste actif.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  rappels:
    runs-on: ubuntu-latest
    steps:
      - name: Rappel jour J
        run: |
          curl -sf -o /dev/null -w "rappel-jour-j: HTTP %{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.CRON_BASE_URL }}/api/cron/rappel-jour-j"
      - name: Rappels WhatsApp
        run: |
          curl -sf -o /dev/null -w "whatsapp: HTTP %{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.CRON_BASE_URL }}/api/cron/whatsapp"
      - name: Rappel veille (17h) par email
        run: |
          curl -sf -o /dev/null -w "rappel-veille: HTTP %{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.CRON_BASE_URL }}/api/cron/rappel-veille"
